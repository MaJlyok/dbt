name: analytics
version: "1.0.0"
profile: fraud_analytics

model-paths: ["models", "sources"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - target
  - dbt_packages

models:
  +persist_docs:
    relation: true
    columns: true

  analytics:
    staging:
      +materialized: view
    marts:
      +materialized: table

seeds:
  analytics:
    us_states:
      +order_by: state_code
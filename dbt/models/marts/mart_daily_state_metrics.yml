version: 2

models:
  - name: mart_daily_state_metrics
    description: Дневные метрики транзакций по штатам.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - tx_date
              - us_state
    columns:
      - name: tx_date
        description: Календарная дата транзакции.
      - name: us_state
        description: Код штата США.
      - name: txn_count
        description: Число транзакций за день в штате.
      - name: total_amount
        description: Сумма транзакций.
      - name: avg_check
        description: Средний чек.
      - name: p95_amount
        description: 95-й перцентиль суммы транзакции.

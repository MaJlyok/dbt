version: 2

models:
  - name: mart_fraud_by_state
    description: Фрод по штатам США
    columns:
      - name: us_state
        description: Код штата США.
        data_tests:
          - unique
      - name: state_name
        description: Название штата из справочника us_states.
      - name: txn_count
        description: Число транзакций в штате.
      - name: fraud_count
        description: Число мошеннических транзакций.
      - name: fraud_rate
        description: Доля фрода в процентах, от 0 до 100.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: total_amount
        description: Сумма всех транзакций штата.
      - name: fraud_amount
        description: Сумма мошеннических транзакций.
      - name: customer_count
        description: Число уникальных клиентов.
      - name: merchant_count
        description: Число уникальных мерчантов.

version: 2

models:
  - name: stg_transactions
    description: Нормализация транзакции.
    columns:
      - name: transaction_time
        description: Время транзакции.
      - name: tx_date
        description: Календарная дата транзакции.
      - name: tx_day_of_week
        description: День недели по ISO, 1 — понедельник, 7 — воскресенье.
      - name: merch
        description: Название мерчанта без крайних пробелов.
      - name: cat_id
        description: Категория мерчанта в нижнем регистре.
        data_tests:
          - not_null
      - name: amount
        description: Сумма транзакции.
      - name: amount_bucket
        description: Сегмент суммы. xs < 10, s < 50, m < 200, l < 500, иначе xl.
      - name: name_1
        description: Имя клиента.
      - name: name_2
        description: Фамилия клиента.
      - name: customer_id
        description: Суррогатный ключ клиента из имени и фамилии.
        data_tests:
          - not_null
      - name: gender
        description: Пол клиента, M или F.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["M", "F"]
      - name: us_state
        description: Код штата США.
        data_tests:
          - not_null
      - name: lat
        description: Широта клиента.
      - name: lon
        description: Долгота клиента.
      - name: merchant_lat
        description: Широта мерчанта.
      - name: merchant_lon
        description: Долгота мерчанта.
      - name: is_fraud
        description: Признак фрода, 1 если транзакция мошенническая.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
